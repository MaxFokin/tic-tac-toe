try { var m = localStorage.getItem('ttt-coach-theme'); if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m; } catch (e) {}</script>
<style>
:root {
  --desk: #EDF0F5;
  --paper: #FFFFFF;
  --ink: #17191F;
  --ink-soft: #596173;
  --line: #D3D9E3;
  --frame: #17191F;
  --btn-border: #17191F;
  --yellow: #FFD23F;
  --x: #1F6FEB;
  --o: #FF8A1E;
  --coach: #E0337F;
  --coach-soft: rgba(224, 51, 127, .30);
  --display: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif;
  --text: 'Andika', 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0F1218; --paper: #1A1E27; --ink: #EEF1F6; --ink-soft: #A2AABA; --line: #2C3240;
    --frame: #05060A; --btn-border: #3A4152;
    --coach: #FF4D9A; --coach-soft: rgba(255, 77, 154, .32); --x: #1F6FEB; --o: #FF8A1E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0F1218; --paper: #1A1E27; --ink: #EEF1F6; --ink-soft: #A2AABA; --line: #2C3240;
  --frame: #05060A; --btn-border: #3A4152;
  --coach: #FF4D9A; --coach-soft: rgba(255, 77, 154, .32); --x: #1F6FEB; --o: #FF8A1E;
  color-scheme: dark;
}
/* Hebrew text: Andika has no Hebrew glyphs, Fredoka (the display font) does. */
:root[lang="he"] { --text: 'Assistant', 'Arial Hebrew', system-ui, sans-serif; }
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100%;
  background: var(--desk); color: var(--ink);
  font: 400 18px/1.45 var(--text);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
  overflow-x: clip;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--coach); outline-offset: 3px; }

.app {
  max-width: 520px; margin: 0 auto; padding: 8px 18px 28px; display: flex; flex-direction: column;
  min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; min-height: 52px; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 21px/1 var(--display); letter-spacing: -0.01em; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.brand .name { display: grid; gap: 2px; text-align: left; }
.brand .name b { font-size: 19px; line-height: 1; }
.brand .name small { font: 600 11px/1 var(--display); letter-spacing: .08em; color: var(--ink-soft); }
.brand svg { width: 28px; height: 28px; border-radius: 8px; flex: none; }
.restart {
  appearance: none; cursor: pointer; background: transparent; color: var(--ink-soft);
  border: 2px solid var(--line); border-radius: 12px; padding: 7px 12px;
  font: 500 15px/1 var(--display); touch-action: manipulation;
}
.restart.armed { color: var(--ink); border-color: var(--coach); }
.app[data-screen="welcome"] .restart { display: none; }

/* Panel */
.panel { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; text-align: center; padding-top: 2px; }
h1 { font: 600 clamp(26px, 7vw, 32px)/1.12 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.lead { margin: 0 auto; max-width: 31ch; color: var(--ink-soft); text-wrap: pretty; }
.note { margin: 0 auto; max-width: 31ch; font-size: 16px; color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; }

/* Buttons */
.actions { display: flex; gap: 12px; margin-top: 4px; }
.btn {
  flex: 1; appearance: none; cursor: pointer; min-height: 58px; padding: 14px 16px;
  font: 600 19px/1.1 var(--display); color: var(--ink); background: var(--paper);
  border: 3px solid var(--btn-border); border-radius: 16px; box-shadow: 0 5px 0 var(--frame);
  transition: transform .08s ease, box-shadow .08s ease, opacity .2s ease; touch-action: manipulation;
}
.btn.primary { background: var(--yellow); color: #17191F; border-color: #17191F; box-shadow: 0 5px 0 #17191F; }
.btn.wide { flex: 2; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--frame); }
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 #17191F; }
.btn:disabled { opacity: .4; cursor: default; }
.textlink {
  appearance: none; align-self: center; background: none; border: 0; padding: 6px 8px; cursor: pointer;
  color: var(--ink-soft); font: 400 16px/1.3 var(--text); text-decoration: underline; text-underline-offset: 3px;
}

/* Welcome steps */
.howto { list-style: none; margin: 0 auto; padding: 0; display: grid; gap: 10px; text-align: start; max-width: 330px; }
.howto li { display: flex; align-items: center; gap: 12px; }
.howto b {
  flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  font: 600 18px/1 var(--display); color: #17191F; background: var(--c); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .14);
}

/* Confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i {
  position: absolute; top: -24px; width: 11px; height: 11px; border-radius: 3px; background: var(--c);
  animation: fall var(--t) cubic-bezier(.25, .6, .45, 1) var(--d) forwards;
}
@keyframes fall { to { transform: translate3d(var(--x), 112vh, 0) rotate(var(--r)); } }

/* Right to left: words follow the language; the header, the board and the credits never mirror */
.top, .board, .langs, .credits { direction: ltr; }

@media (max-width: 360px) {
  .app { padding-left: 14px; padding-right: 14px; }
  .btn { font-size: 17px; }
}
@media (max-height: 720px) {
  .panel { gap: 10px; }
  h1 { font-size: 24px; }
  .lead { font-size: 16px; max-width: 38ch; }
  .btn { min-height: 52px; padding: 11px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .confetti i { animation-duration: .01s !important; }
}
/* Choice tiles */
.choose { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 2px; }
.tile {
  appearance: none; cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 8px; padding: 16px 10px 14px;
  color: var(--ink); background: var(--paper); border: 3px solid var(--btn-border); border-radius: 20px;
  box-shadow: 0 6px 0 var(--frame); transition: transform .08s ease, box-shadow .08s ease; touch-action: manipulation;
}
.tile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--frame); }
.tile strong { font: 600 22px/1 var(--display); letter-spacing: -0.01em; }
.tile small { font: 400 15px/1.2 var(--text); color: var(--ink-soft); }

/* Header tools, top right: the language switch (welcome screen only, where Start over is away)
   and the light/dark toggle. The header never mirrors, so the brand stays top-left and the tools
   top-right in Hebrew too. */
.top { direction: ltr; }
.tools { display: flex; align-items: center; gap: 8px; }
.langs { display: none; }
.app[data-screen="welcome"] .langs { display: flex; }
.lang {
  appearance: none; cursor: pointer; display: grid; justify-items: center; gap: 1px; padding: 3px 9px 4px;
  font: 600 9px/1 var(--display); letter-spacing: .08em; color: var(--ink-soft); background: var(--paper);
  border: 2px solid var(--line); border-radius: 0; margin-inline-start: -2px; touch-action: manipulation;
}
.lang:first-child { border-radius: 999px 0 0 999px; margin-inline-start: 0; }
.lang:last-child { border-radius: 0 999px 999px 0; }
.lang i { font: 400 15px/1 system-ui, sans-serif; font-style: normal; }
.lang[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); position: relative; z-index: 1; }
.theme {
  appearance: none; cursor: pointer; width: 36px; height: 33px; padding: 0; display: grid; place-items: center;
  background: transparent; color: var(--ink-soft); border: 2px solid var(--line); border-radius: 999px; touch-action: manipulation;
}
.theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme .sun, .theme.dark .moon { display: none; }
.theme.dark .sun { display: block; }

/* Credits: one quiet line below every screen, at the bottom of the phone when there is room.
   Pinned left-to-right and to Andika, so it looks the same in every language. */
.credits {
  direction: ltr; margin-top: auto; padding-top: 24px; display: flex; justify-content: center; align-items: center;
  flex-wrap: wrap; gap: 2px 10px; color: var(--ink-soft); font: 400 13px/1.3 'Andika', 'Assistant', 'Arial Hebrew', system-ui, sans-serif;
}
.credits a { display: inline-flex; align-items: center; gap: 5px; padding: 8px 2px; color: inherit; text-decoration: none; touch-action: manipulation; }
.credits a:hover { color: var(--ink); }
.credits svg { width: 14px; height: 14px; fill: currentColor; flex: none; }
.credits .dot { opacity: .45; }

/* Welcome: who plays, the coach's level, your mark, who starts */
.choose.n3 { grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.choose.n3 .tile { padding: 12px 6px 10px; gap: 4px; }
.choose.n3 .tile small { font-size: 13px; }
.tile[aria-pressed="true"] { border-color: var(--coach); box-shadow: 0 6px 0 var(--coach); }
.tile .ico { width: 56px; height: 56px; display: grid; place-items: center; }
.tile .ico svg { width: 100%; border-radius: 13px; }
.label { font: 500 15px/1.2 var(--display); color: var(--ink-soft); margin: 2px 0 -6px; }
.line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.line .label { margin: 0; text-align: start; }
.seg { display: flex; justify-content: center; }
.seg button {
  appearance: none; cursor: pointer; min-height: 44px; padding: 0 14px; margin-inline-start: -2px;
  font: 600 17px/1 var(--display); color: var(--ink-soft); background: var(--paper);
  border: 2px solid var(--line); border-radius: 0; touch-action: manipulation;
}
.seg button:first-child { margin-inline-start: 0; border-start-start-radius: 999px; border-end-start-radius: 999px; }
.seg button:last-child { border-start-end-radius: 999px; border-end-end-radius: 999px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); position: relative; z-index: 1; }
.seg .mark[data-mark="X"] { color: var(--x); }
.seg .mark[data-mark="O"] { color: var(--o); }
.seg .mark[data-mark="X"][aria-pressed="true"] { background: var(--x); border-color: var(--x); color: #fff; }
.seg .mark[data-mark="O"][aria-pressed="true"] { background: var(--o); border-color: var(--o); color: #fff; }
.btn.small { flex: none; min-width: 170px; min-height: 50px; margin: 0 auto; padding: 10px 28px; }
</style>
</head>

<script>
(() => {
'use strict';
// ===== The game: board, search, levels, hints. No DOM. =====

// ----- The board: nine cells, row by row from the top left; each '' or 'X' or 'O' -----
const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const CENTER = 4;
const CORNERS = [0, 2, 6, 8];
const SIDES = [1, 3, 5, 7];
const other = (mark) => (mark === 'X' ? 'O' : 'X');
const emptyBoard = () => Array(9).fill('');
const empties = (board) => board.flatMap((c, i) => (c === '' ? [i] : []));
const isFull = (board) => empties(board).length === 0;
const play = (board, i, mark) => board.map((c, j) => (j === i ? mark : c));
function winner(board) {
  for (const line of LINES) {
    const m = board[line[0]];
    if (m && line.every((i) => board[i] === m)) return { mark: m, line };
  }
  return null;
}

// ----- The search: the whole tree is 5478 positions, so plain minimax with a cache -----
const valueCache = new Map();
// 1 if `mark`, to move, can force a win, 0 a draw, -1 a loss.
function valueOf(board, mark) {
  const w = winner(board);
  if (w) return w.mark === mark ? 1 : -1;
  if (isFull(board)) return 0;
  const key = board.map((c) => c || '.').join('') + mark; // '.' for empty: '' cells would make different boards collide
  if (!valueCache.has(key)) {
    valueCache.set(key, Math.max(...empties(board).map((i) => 0 - valueOf(play(board, i, mark), other(mark)))));
  }
  return valueCache.get(key);
}
// Every empty square with its value from `mark`'s view after playing it.
const moveValues = (board, mark) =>
  empties(board).map((square) => ({ square, value: 0 - valueOf(play(board, square, mark), other(mark)) }));
function bestSquares(board, mark) {
  const values = moveValues(board, mark);
  const top = Math.max(...values.map((m) => m.value));
  return values.filter((m) => m.value === top).map((m) => m.square);
}
// Empty squares where `mark` completes three.
const threats = (board, mark) => empties(board).filter((i) => winner(play(board, i, mark))?.mark === mark);
// Empty squares where playing `mark` leaves two or more threats (a square that wins outright is not a fork).
const forkSquares = (board, mark) =>
  empties(board).filter((i) => !winner(play(board, i, mark)) && threats(play(board, i, mark), mark).length >= 2);

// ----- The hint: the best square and a reason that is true of it -----
// In the order the coach prefers to name them.
const REASONS = ['win', 'block', 'fork', 'twoInRow', 'stopFork', 'center', 'corner', 'any', 'side'];
// Is `reason` true of `square` for `mark` to play? The one place that says what each reason means.
function isReason(board, mark, square, reason) {
  const foe = other(mark);
  switch (reason) {
    case 'win': return threats(board, mark).includes(square);
    case 'block': return threats(board, foe).includes(square);
    case 'fork': return forkSquares(board, mark).includes(square);
    case 'twoInRow': return forkSquares(board, foe).length > 0 && threats(play(board, square, mark), mark).length === 1;
    case 'stopFork': return forkSquares(board, foe).includes(square);
    case 'center': return square === CENTER;
    case 'corner': return CORNERS.includes(square);
    case 'side': return SIDES.includes(square);
    case 'any': return empties(board).every((s) => bestSquares(board, mark).includes(s));
  }
}
// The first true reason for a square, never the vague 'any'.
const reasonFor = (board, mark, square) => REASONS.find((r) => r !== 'any' && isReason(board, mark, square, r));
// The best square with the first reason that names it, the lowest square on a tie.
function advise(board, mark) {
  const best = bestSquares(board, mark);
  for (const reason of REASONS) {
    const square = best.find((s) => isReason(board, mark, s, reason));
    if (square !== undefined) return { square, reason };
  }
}

// ----- The three coaches -----
// ponytail: knobs, tune after Max's son has played
const EASY_WIN = 0.5;
const EASY_BLOCK = 0.5;
let random = Math.random;
const useRandom = (fn) => { random = fn; };
const pick = (list) => list[Math.floor(random() * list.length)];
// The square for `mark` at `level` ('easy', 'medium' or 'hard') and the reason that is true of it.
function coachMove(board, mark, level) {
  const wins = threats(board, mark), blocks = threats(board, other(mark));
  let square;
  if (level === 'hard') square = pick(bestSquares(board, mark));
  else if (wins.length && (level === 'medium' || random() < EASY_WIN)) square = wins[0];
  else if (blocks.length && (level === 'medium' || random() < EASY_BLOCK)) square = blocks[0];
  else square = pick(empties(board));
  return { square, reason: reasonFor(board, mark, square) };
}

// ----- Why the child lost: the one thing the coach names after it wins -----
// 'missedWin', 'missedBlock', 'fork' or 'general'. `history` is [{ mark, square }] from the empty board.
function lossReason(history, childMark) {
  const coach = other(childMark);
  const seen = new Set();
  let board = emptyBoard();
  for (const { mark, square } of history) {
    if (mark === childMark) {
      const wins = threats(board, mark), blocks = threats(board, coach);
      if (wins.length && !wins.includes(square)) seen.add('missedWin');
      else if (blocks.length && !blocks.includes(square)) seen.add('missedBlock');
    } else if (forkSquares(board, mark).includes(square)) seen.add('fork');
    board = play(board, square, mark);
  }
  if (winner(board)?.mark !== coach) return 'general';
  return ['missedWin', 'missedBlock', 'fork'].find((r) => seen.has(r)) || 'general';
}
// ===== Words, in every language =====
// STRINGS[key] = { en, he, pl }. A value is a string with {name} placeholders or a plural set
// ({ one, two, few, many, other }; other is required). t(key, vars) picks the current language,
// falls back to English and fills every {name} from vars. No DOM in this file.
const LANGS = {
  en: { name: 'English', dir: 'ltr', flag: '🇬🇧', code: 'EN' },
  he: { name: 'עברית', dir: 'rtl', flag: '🇮🇱', code: 'HE' },
  pl: { name: 'Polski', dir: 'ltr', flag: '🇵🇱', code: 'PL' },
};
let lang = 'en';
const useLang = (code) => { lang = code; };
const PLURALS = {};
function pluralOf(n) {
  if (n === undefined) return 'other';
  try { return (PLURALS[lang] || (PLURALS[lang] = new Intl.PluralRules(lang))).select(n); } catch (e) { return 'other'; }
}
function t(key, vars = {}) {
  const entry = STRINGS[key];
  if (!entry) return key;
  let v = entry[lang] !== undefined ? entry[lang] : entry.en;
  while (v && typeof v === 'object') {
    const c = pluralOf(vars.n); v = v[c] !== undefined ? v[c] : v.other;
  }
  if (typeof v !== 'string') return key;
  return v.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
}

// ===== Look and words =====
const STICKERS = ['#1FAD5C', '#FFD43B', '#D7263D', '#FF8A1E', '#1F6FEB', '#F6F6F1'];
const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const $ = (sel) => document.querySelector(sel);
const appEl = $('#app'), panelEl = $('#panel'), restartBtn = $('#restart');

// ===== State =====
const app = { screen: 'welcome', setup: { mode: 'single', level: 'easy', mark: 'X', first: 'me' } };
const KEY = 'ttt-coach-v1';
const SETUP_KEY = 'ttt-coach-setup';
function save() { /* Task 10 */ }
function restore() { /* Task 10 */ }

// The welcome screen's four choices, kept under their own key so Start over never touches them.
const SETUP_CHOICES = { mode: ['single', 'two'], level: ['easy', 'medium', 'hard'], mark: ['X', 'O'], first: ['me', 'coach', 'random'] };
function loadSetup() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SETUP_KEY)); } catch (e) { /* storage unavailable or not JSON */ }
  for (const k in SETUP_CHOICES) if (saved && SETUP_CHOICES[k].includes(saved[k])) app.setup[k] = saved[k];
}
function saveSetup() {
  try { localStorage.setItem(SETUP_KEY, JSON.stringify(app.setup)); } catch (e) { /* storage unavailable */ }
}

// ===== Language =====
// Kept under its own key, apart from the progress record, so Start over and restore() never touch it.
const LANG_KEY = 'ttt-coach-lang';
const make = (cls) => { const el = document.createElement('div'); el.className = cls; return el; };

// applyLang switches the words without saving, so an untouched app keeps following the phone;
// setLang (the switch) saves the choice.
function applyLang(code) {
  useLang(code);
  document.documentElement.lang = code;
  document.documentElement.dir = LANGS[code].dir;
}
function setLang(code) {
  applyLang(code);
  try { localStorage.setItem(LANG_KEY, code); } catch (e) { /* storage unavailable */ }
}
// The phone's language when it is one of ours, else English.
const phoneLang = () => (navigator.languages || [navigator.language]).map((l) => String(l).slice(0, 2).toLowerCase()).find((l) => Object.keys(LANGS).includes(l)) || 'en';
// The switch: one segmented control in the header's tools group, beside the theme toggle, built
// once from LANGS. CSS shows it on the welcome screen only. Each segment is the language's flag
// over its code; the full name is the label.
let langsEl = null;
function refreshLangs() {
  if (!langsEl) {
    langsEl = make('langs');
    langsEl.setAttribute('role', 'group');
    langsEl.innerHTML = Object.keys(LANGS).map((code) =>
      `<button class="lang" type="button" data-lang="${code}" lang="${code}" aria-label="${LANGS[code].name}"><i>${LANGS[code].flag}</i>${LANGS[code].code}</button>`).join('');
    langsEl.querySelectorAll('.lang').forEach((b) => b.addEventListener('click', () => { setLang(b.dataset.lang); disarm(); render(false); }));
    $('.tools').insertBefore(langsEl, themeBtn);
  }
  langsEl.setAttribute('aria-label', t('language'));
  langsEl.querySelectorAll('.lang').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}

// ===== Theme =====
// Light or dark on request; without a saved choice the app follows the phone. The same key is read
// by a one-line script in the head, so a saved choice is applied before the first paint.
const THEME_KEY = 'ttt-coach-theme';
const themeBtn = $('#theme');
function isDark() {
  const mode = document.documentElement.dataset.theme;
  return mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
}
function setTheme(mode) {
  document.documentElement.dataset.theme = mode;
  try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* storage unavailable */ }
}
// The icon shows the way out (a sun in the dark), the label says where it leads.
function paintTheme() {
  themeBtn.classList.toggle('dark', isDark());
  themeBtn.setAttribute('aria-label', t(isDark() ? 'lightMode' : 'darkMode'));
}

// Everything outside the panel that has words in the current language: the switch and the theme
// toggle. The credits line stays English.
function refreshChrome() {
  refreshLangs();
  paintTheme();
}

// ===== Screens =====
const btn = (id, label, cls = '') => `<button class="btn ${cls}" id="${id}" type="button">${label}</button>`;
const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };

function go(screen) {
  app.screen = screen;
  save();
  render(true);
  window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
}

function render(animate) {
  appEl.dataset.screen = app.screen;
  refreshChrome();
  ({ welcome: screenWelcome, play: screenPlay }[app.screen] || screenWelcome)(animate);
}

// The tile icons: the header's logo for Single player, a blue X beside an orange O for 2 players.
const LOGO = $('.brand svg').outerHTML;
const TWO_ICON = '<svg viewBox="0 0 100 60" aria-hidden="true"><path d="M12 12 40 48M40 12 12 48" stroke="#1F6FEB" stroke-width="11" stroke-linecap="round" fill="none"/><circle cx="74" cy="30" r="17" stroke="#FF8A1E" stroke-width="11" fill="none"/></svg>';
const AGES = { easy: 'age5', medium: 'age8', hard: 'age10' };

// Every choice is a button with one data-* attribute naming the setup key it sets.
function screenWelcome() {
  const s = app.setup;
  const press = (key, v) => `type="button" data-${key}="${v}" aria-pressed="${s[key] === v}"`;
  const mode = (v, ico) => `<button class="tile" id="mode-${v}" ${press('mode', v)}><span class="ico">${ico}</span><strong>${t(v)}</strong></button>`;
  const seg = (key, label, text) => `<div class="line"><span class="label">${t(label)}</span><div class="seg" role="group">${
    SETUP_CHOICES[key].map((v) => `<button class="${key}" ${press(key, v)}>${text(v)}</button>`).join('')}</div></div>`;
  const coachRows = `<div class="label">${t('coachLevel')}</div>
    <div class="choose n3">${SETUP_CHOICES.level.map((v) => `<button class="tile level" ${press('level', v)}><strong>${t(v)}</strong><small>${t(AGES[v])}</small></button>`).join('')}</div>
    ${seg('mark', 'youAre', (v) => v)}${seg('first', 'whoStarts', t)}`;
  const howto = `<ul class="howto">${['x', 'o', 'yellow'].map((c, i) => `<li><b style="--c:var(--${c})">${i + 1}</b><span>${t('howto' + (i + 1))}</span></li>`).join('')}</ul>`;
  panelEl.innerHTML = `<h1>${t('whoPlays')}</h1>
    <div class="choose">${mode('single', LOGO)}${mode('two', TWO_ICON)}</div>
    ${s.mode === 'single' ? coachRows : howto}
    <div class="actions">${btn('play', t('play'), 'primary small')}</div>`;
  panelEl.querySelectorAll('[aria-pressed]').forEach((b) => b.addEventListener('click', () => {
    const [key, v] = Object.entries(b.dataset)[0];
    app.setup[key] = v;
    saveSetup();
    render(false);
  }));
  on('play', startGame);
}

function startGame() {
  const s = app.setup;
  app.game = { ...s };
  app.board = emptyBoard();
  app.history = [];
  app.hint = null;
  app.result = null;
  app.starter = s.mode === 'two' ? 'X' : s.first === 'me' ? s.mark : s.first === 'coach' ? other(s.mark) : pick(['X', 'O']);
  app.turn = app.starter;
  const drawn = s.mode === 'single' && s.first === 'random';
  app.line = { key: drawn ? (app.starter === s.mark ? 'boxYouStart' : 'boxCoachStarts') : 'boxStuck' };
  go('play');
}

function screenPlay() {
  panelEl.innerHTML = `<h1>${t('yourTurn')}</h1>`;
}

function confetti() {
  if (reduced) return;
  const layer = document.createElement('div');
  layer.className = 'confetti';
  const cols = STICKERS;
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.setProperty('--c', cols[i % cols.length]);
    p.style.setProperty('--x', (Math.random() * 40 - 20).toFixed(1) + 'vw');
    p.style.setProperty('--r', Math.round(Math.random() * 720 - 360) + 'deg');
    p.style.setProperty('--t', (2.2 + Math.random() * 1.6).toFixed(2) + 's');
    p.style.setProperty('--d', (Math.random() * 0.5).toFixed(2) + 's');
    layer.appendChild(p);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 4600);
}


// ===== Start =====
let restartArmed = false, restartTimer = null;
function disarm() { restartArmed = false; clearTimeout(restartTimer); restartBtn.textContent = t('startOver'); restartBtn.classList.remove('armed'); }
restartBtn.addEventListener('click', () => {
  if (!restartArmed) {
    restartArmed = true;
    restartBtn.textContent = t('startOverArmed');
    restartBtn.classList.add('armed');
    restartTimer = setTimeout(disarm, 2600);
    return;
  }
  disarm();
  go('welcome');
});

themeBtn.addEventListener('click', () => { setTheme(isDark() ? 'light' : 'dark'); paintTheme(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);

let savedLang = null;
try { savedLang = localStorage.getItem(LANG_KEY); } catch (e) { /* storage unavailable */ }
applyLang(Object.keys(LANGS).includes(savedLang) ? savedLang : phoneLang());
disarm();
loadSetup();
restore();
render(false);
})();
